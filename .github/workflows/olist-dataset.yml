name: Build and validate Olist relational dataset
on:
  push:
    branches: [main]
    paths:
      - 'datasets/source_relational/olist/build.py'
      - 'datasets/source_relational/olist/validate.py'
      - 'datasets/source_relational/olist/diagram.py'
      - 'datasets/source_relational/olist/source/upstream_files.json'
      - '.github/workflows/olist-dataset.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: olist-dataset-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build complete pinned source data and validate SQL
        run: |
          python datasets/source_relational/olist/build.py --cache "$RUNNER_TEMP/olist-source"
          python datasets/source_relational/olist/validate.py
          git diff --check
      - name: Publish full compressed snapshot, dictionary and review artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/source_relational/olist/input/database.sqlite.gz datasets/source_relational/olist/input/data_dictionary.json datasets/source_relational/olist/evaluation/schema.sql datasets/source_relational/olist/source/provenance.json datasets/source_relational/olist/docs
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish validated Olist SQLite snapshot [skip ci]'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
