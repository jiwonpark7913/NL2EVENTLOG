name: Publish AirlineFlow pilot Gold v7
on:
  push:
    branches: [data/airlineflow-pilot-gold-20261125]
    paths: ['datasets/synthetic/airlineflow/private/pilot/verify_pilot.py']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate frozen Gold assets
        run: |
          command -v dot || (sudo apt-get update && sudo apt-get install -y graphviz)
          python datasets/synthetic/airlineflow/private/pilot/verify_pilot.py --materialize
      - name: Verify fresh database reconstruction and all references
        run: python datasets/synthetic/airlineflow/generate.py --check
      - name: Publish validated reference artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/synthetic/airlineflow/private/pilot
          git diff --cached --quiet || git commit -m 'data: publish verified pilot Gold v7 logs and DFG'
          git push
