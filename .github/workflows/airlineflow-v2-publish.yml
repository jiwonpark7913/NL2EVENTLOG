name: Publish stochastic AirlineFlow v2
on:
  push:
    branches: [main]
    paths:
      - 'datasets/synthetic/airlineflow/regenerate_v2.py'
      - 'datasets/synthetic/airlineflow/docs/review_v2_template.html'
      - 'datasets/synthetic/airlineflow/refresh_review_v2.py'
      - '.github/workflows/airlineflow-v2-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: airlineflow-v2-publish
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and independently validate
        run: |
          set -euo pipefail
          cd datasets/synthetic/airlineflow
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only "${{ github.event.before }}" HEAD -- . ':!docs/review_v2_template.html' ':!refresh_review_v2.py' | grep -q '^regenerate_v2.py
      - name: Publish atomically after checks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/synthetic/airlineflow
          git diff --cached --quiet && exit 0
          git commit -m "data/docs: publish validated AirlineFlow fixture or review update"
          git push origin HEAD:main
; then
            command -v dot || (sudo apt-get update && sudo apt-get install -y graphviz)
            python regenerate_v2.py
            cp verify_v2.py verify.py
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            command -v dot || (sudo apt-get update && sudo apt-get install -y graphviz)
            python regenerate_v2.py
            cp verify_v2.py verify.py
          else
            python refresh_review_v2.py
          fi
          python verify.py
      - name: Publish atomically after checks
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/synthetic/airlineflow
          git diff --cached --quiet && exit 0
          git commit -m "data: replace AirlineFlow evaluation fixture with validated stochastic v2"
          git push origin HEAD:main
