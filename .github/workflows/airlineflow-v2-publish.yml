name: Publish AirlineFlow review
on:
  push:
    branches: [main]
    paths:
      - 'datasets/synthetic/airlineflow/publish_review.py'
      - 'datasets/synthetic/airlineflow/generate.py'
      - 'datasets/synthetic/airlineflow/verify.py'
      - 'datasets/synthetic/airlineflow/docs/review_v2_template.html'
      - 'datasets/synthetic/airlineflow/docs/readme_template.md'
      - 'datasets/synthetic/airlineflow/docs/render_readme.py'
      - 'datasets/synthetic/airlineflow/refresh_review_v2.py'
      - 'datasets/synthetic/airlineflow/enrich_review.py'
      - 'datasets/synthetic/airlineflow/activity_dfg.py'
      - '.github/workflows/airlineflow-v2-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: airlineflow-v2-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce and audit the release
        run: |
          set -euo pipefail
          command -v dot || (sudo apt-get update && sudo apt-get install -y graphviz)
          python datasets/synthetic/airlineflow/publish_review.py
      - name: Publish validated review assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/synthetic/airlineflow
          git diff --cached --quiet && exit 0
          git commit -m "docs: publish verified AirlineFlow review assets"
          git push origin HEAD:main
