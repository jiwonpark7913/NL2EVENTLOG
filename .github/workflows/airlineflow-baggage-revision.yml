name: AirlineFlow baggage revision
on:
  push:
    branches: [data/airlineflow-baggage-20261125]
    paths: ['datasets/synthetic/airlineflow/revise_baggage.py']
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python datasets/synthetic/airlineflow/verify.py
      - run: python datasets/synthetic/airlineflow/revise_baggage.py
      - run: python datasets/synthetic/airlineflow/verify.py
      - name: Publish validated revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/synthetic/airlineflow
          git diff --cached --quiet || git commit -m 'data: vary baggage scan timing and clarify operation semantics'
          git push
