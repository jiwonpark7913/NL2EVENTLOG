name: Build MIMIC-IV Demo benchmark assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'datasets/mimic/build.py'
      - 'tests/test_mimic_builder.py'
      - '.github/workflows/mimic-dataset.yml'
permissions:
  contents: write
concurrency:
  group: mimic-demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight syntax and MIMIC smoke tests
        run: |
          set -euo pipefail
          python -m py_compile datasets/mimic/build.py tests/test_mimic_builder.py
          python -u tests/test_mimic_builder.py
      - name: Download official public MIMIC demo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mimic-download"
          cd "$RUNNER_TEMP/mimic-download"
          # PhysioNet explicitly documents recursive wget for the public Demo v2.2.
          wget --recursive --no-parent --no-host-directories --cut-dirs=3 \
            --continue --tries=4 --timeout=90 \
            https://physionet.org/files/mimic-iv-demo/2.2/
          echo "Downloaded CSV files:"
          find . -type f \( -name '*.csv.gz' -o -name '*.csv' \) | sort
          test "$(find . -type f \( -name '*.csv.gz' -o -name '*.csv' \) | wc -l)" -ge 20
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          mkdir -p "$RUNNER_TEMP/mimic-iv-demo"
          cp -a . "$RUNNER_TEMP/mimic-iv-demo/"
      - name: Build SQLite and review artifacts
        run: |
          set -euo pipefail
          python -m pip install cairosvg==2.8.2
          python datasets/mimic/build.py --source "$RUNNER_TEMP/mimic-iv-demo" --png
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          p=Path('datasets/mimic/input')
          dd=json.loads((p/'data_dictionary.json').read_text())
          assert len(dd['tables'])>=20,dd['statistics']
          conn=sqlite3.connect(p/'database.sqlite')
          assert conn.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert conn.execute('select count(*) from patients').fetchone()[0]==100
          print(dd['statistics'])
          PY
          git diff --check
      - name: Commit generated datasets and diagrams
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import gzip,shutil
          db=Path("datasets/mimic/input/database.sqlite")
          if db.stat().st_size > 90_000_000:
              with db.open("rb") as src,gzip.open(str(db)+".gz","wb",compresslevel=6) as dst:shutil.copyfileobj(src,dst)
              db.unlink()
              print("SQLite exceeds GitHub 100 MB file limit; committed database.sqlite.gz")
          PY
          git add datasets/mimic/input datasets/mimic/docs datasets/mimic/review/database
          if ! git diff --cached --quiet; then
            git commit -m 'data: materialize public MIMIC-IV Demo'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
