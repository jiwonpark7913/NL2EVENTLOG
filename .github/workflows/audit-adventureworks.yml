name: Audit AdventureWorks benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/audit_benchmark.py'
      - 'datasets/adventureworks/validate.py'
      - '.github/workflows/audit-adventureworks.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate physical database, source hashes and ERD
        run: |
          set -euo pipefail
          python -m py_compile tools/audit_benchmark.py
          python tools/audit_benchmark.py --dataset adventureworks --report "$RUNNER_TEMP/adventureworks_integrity_audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adventureworks-integrity-audit
          path: ${{ runner.temp }}/adventureworks_integrity_audit.json
          if-no-files-found: warn
