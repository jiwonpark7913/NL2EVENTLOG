name: Annotate all timestamp columns in schema visuals
on:
  push:
    branches: [refactor/all-datasets-gold-review-and-clean-readmes]
    paths:
      - 'tools/highlight_dataset_timestamps.py'
      - '.github/workflows/highlight-dataset-timestamps.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Highlight Gold and other temporal attributes
        run: python tools/highlight_dataset_timestamps.py
      - name: Commit inspection visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/*/docs/schema.drawio datasets/*/review/database/schema.svg
          git diff --cached --quiet || git commit -m 'docs: annotate temporal evidence in all four relational ERDs'
          git push
