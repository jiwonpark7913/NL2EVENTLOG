name: Refresh semantic-code database inspection
on:
  push:
    branches: [feature/activity-semantics-benchmark]
    paths:
      - 'datasets/**/input/database.sqlite'
      - 'datasets/**/input/data_dictionary.json'
      - '.github/workflows/activity-code-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate actual SQLite table previews and Draw.io diagrams
        run: python tools/build_dataset_review.py
      - name: Commit refreshed review assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/*/review/database datasets/*/docs/schema.drawio
          git diff --cached --quiet || git commit -m 'docs: refresh actual SQL table previews after code migration'
          git push
