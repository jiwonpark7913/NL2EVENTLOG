name: Align EEG entity terminology in dataset reviews
on:
  push:
    branches: [refactor/eeg-entity-terminology]
    paths:
      - 'tools/migrate_eeg_terminology.py'
      - '.github/workflows/eeg-entity-terminology.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild source projections and apply terminology twice (idempotence check)
        run: |
          python tools/rebuild_all_dataset_reviews.py
          python tools/migrate_eeg_terminology.py
          git diff --exit-code -- datasets/*/input datasets/*/private datasets/*/evaluation
      - name: Verify all four candidate manifest policies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for n in ('hospitalflow','plateflow','universityflow','warehouseflow'):
              p=Path('datasets')/n/'review/gold_dfg/entity_model_candidates.json'
              d=json.loads(p.read_text())
              assert d['status']=='candidate_only_not_validated_ET_gold'
              assert not d['default_reverse_fk_traversal']
              assert len(d['entity_representations']) in (11,12)
          PY
      - name: Commit reviewed documentation artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/system datasets/*/README.md datasets/*/docs datasets/*/design datasets/*/review/database/README.md datasets/*/review/database/gold_evidence_graph.svg datasets/*/review/gold_dfg/event_graph.md datasets/*/review/gold_dfg/entity_model_candidates.json
          git diff --cached --quiet || git commit -m 'docs: align existing Gold review to EEG/ER/ET with provisional identity namespaces'
          git push
