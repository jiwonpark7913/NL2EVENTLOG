name: Migrate and validate activity-code benchmark
on:
  push:
    branches: [feature/activity-semantics-benchmark]
    paths:
      - 'tools/experiments/migrate_activity_code_semantics.py'
      - '.github/workflows/activity-semantics-migration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify baseline and migrate DB + dictionary + Gold
        run: python tools/experiments/migrate_activity_code_semantics.py --apply
      - name: Commit migrated datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datasets/*/input/database.sqlite datasets/*/input/data_dictionary.json datasets/*/private/gold.jsonl datasets/*/private/gold_sql docs/system/activity_semantics_migration_report.json
          git diff --cached --quiet || git commit -m 'data: migrate physical action codes and verified Gold SQL'
          git push
