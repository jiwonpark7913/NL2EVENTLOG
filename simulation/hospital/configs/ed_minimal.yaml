# Smallest useful example: emergency department only.
# Shows the four sections; copy it to start a new scenario.
seed: 1
clock: {start: "2150-01-01T00:00:00", observation_end_days: 30}

# 1. OBJECTS ------------------------------------------------------------------
objects:
  patient:
    attributes: {gender: {dist: choice, values: [F, M]}}
    id: {start: 10000000, step: {dist: int_uniform, low: 1, high: 50}}
  ed_stay:
    links: [patient]
    attributes: {acuity: {dist: choice, values: [1, 2, 3, 4, 5], weights: [1, 8, 12, 4, 1]}}
    id: {start: 30000000, step: {dist: int_uniform, low: 1, high: 50}}

# 2. VARIABLES ----------------------------------------------------------------
variables:
  n_patients: 20
  triage_delay: {dist: lognormal, median: 10, sigma: 0.5}
  ed_los: {dist: lognormal, median: 4, sigma: 0.5, unit: h}
  vital_gap: {dist: uniform, low: 45, high: 120}

# 3. PROCESS ------------------------------------------------------------------
process:
  arrivals: {patients: $n_patients, window_days: 14}
  entry: visit
  flows:
    visit:
      - create: ed_stay
        as: ed
      - act: ED Arrival
        on: [ed, patient]
      - act: Triage
        on: [ed]
        delay: $triage_delay
      - during:
          main: [{wait: $ed_los}]
          background:
            - spawn: [{act: Vital Signs, on: [ed], attrs: {heartrate: {dist: normal, mean: 85, sd: 12, round: 0}}}]
              count: 20
              gap: $vital_gap
      - act: ED Departure
        on: [ed]

# 4. RECORDING ----------------------------------------------------------------
recording:
  tables:
    - name: edstays                 # column encoding: arrival/departure as columns
      kind: object
      object: ed_stay
      columns:
        stay_id: {id: self, pk: true}
        subject_id: {id: patient}
        intime: {event_time: ED Arrival}
        outtime: {event_time: ED Departure}
        acuity: {attr: acuity}       # triage has NO timestamp in the DB
    - name: vitalsign               # row encoding: one row per measurement event
      kind: event
      activities: [Vital Signs]
      columns:
        stay_id: {id: ed_stay, fk: edstays.stay_id}
        charttime: {time: event}
        storetime: {time: event, offset: {dist: lognormal, median: 3, sigma: 0.5}}
        heartrate: {event_attr: heartrate}
