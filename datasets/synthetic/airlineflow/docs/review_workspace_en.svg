" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Approve and next request</text><text x="1108" y="778" font-size="13" font-weight="bold">Technical preflight</text><text x="1108" y="799" font-size="12" fill="#526c7a">Separate from human semantic review.</text><text x="1108" y="824" font-size="11" fill="#526c7a">Illustration, not evidence of reviewer completion.</text></g></svg>