 handling_jobs.job_id</text><text x="645" y="428" font-size="14" font-weight="bold">Selected database row</text><rect x="645" y="440" width="418" height="25" fill="#e9eff2"/><text x="654" y="457" font-size="12" font-weight="normal">job_id</text><text x="832" y="457" font-size="12">HJ-106680</text><rect x="645" y="467" width="418" height="25" fill="#f4f7f9"/><text x="654" y="484" font-size="12" font-weight="normal">turn_id</text><text x="832" y="484" font-size="12">TU-606346</text><rect x="645" y="494" width="418" height="25" fill="#e9eff2"/><text x="654" y="511" font-size="12" font-weight="normal">job_code</text><text x="832" y="511" font-size="12">DP</text><rect x="645" y="521" width="418" height="25" fill="#c6e5d8"/><text x="654" y="538" font-size="12" font-weight="bold">started_at</text><text x="832" y="538" font-size="12">2026-12-03 11:32:24</text><rect x="645" y="548" width="418" height="25" fill="#e9eff2"/><text x="654" y="565" font-size="12" font-weight="normal">finished_at</text><text x="832" y="565" font-size="12">2026-12-03 11:42:47</text><rect x="645" y="575" width="418" height="25" fill="#f4f7f9"/><text x="654" y="592" font-size="12" font-weight="normal">posted_at</text><text x="832" y="592" font-size="12">2026-12-03 11:50:02</text><text x="645" y="638" font-size="16" font-weight="bold">Gold PI / ESpec / SQL</text><rect x="645" y="652" width="418" height="112" rx="5" fill="#f0f4f7"/><g font-family="monospace" font-size="12"><text x="658" y="673">SELECT job_id AS case_id,</text><text x="658" y="691">  'Disembarkation Start' AS activity,</text><text x="658" y="709">  started_at AS timestamp</text><text x="658" y="727">FROM handling_jobs</text><text x="658" y="745">WHERE job_code = 'DP'</text></g><text x="645" y="787" font-size="12" fill="#526c7a">One reference SQL branch shown.</text><text x="645" y="807" font-size="12" fill="#526c7a">Posted time is not the work occurrence time.</text><rect x="1090" y="128" width="338" height="726" rx="8" fill="white" stro